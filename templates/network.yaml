# CloudFormation template format version, not the creation date
AWSTemplateFormatVersion: '2010-09-09'

# Template description
Description: Network Resources for cloudformation-iac-lab

# Define AWS resources to create
Resources:
  # Logical ID of the VPC within this template
  VPC:
    # Resource type: VPC
    Type: AWS::EC2::VPC
    Properties:
      # Private IPv4 address range for the VPC
      CidrBlock: '10.0.0.0/16'

      # Use default shared hardware tenancy for EC2 instances
      InstanceTenancy: default

      # Enable public DNS hostnames for eligible EC2 instances
      # This setting does not assign public IP addresses
      EnableDnsHostnames: true

      # Enable DNS resolution using the Amazon-provided DNS server
      EnableDnsSupport: true

      # Tags for resource identification and management
      Tags:
        # Resource name displayed in the AWS console
        - Key: Name
          Value: sample-vpc

        # Project name
        - Key: Project
          Value: cloudformation-iac-lab

        # Environment purpose
        - Key: Environment
          Value: learning

# Values displayed in the stack Outputs tab
Outputs:
  # Output key
  VpcId:
    Description: Created VPC ID

    # Ref returns the ID of the VPC created by this template
    Value: !Ref VPC